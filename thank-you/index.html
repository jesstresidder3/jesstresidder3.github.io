<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message sent | Jess Tresidder</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://jesstresidder.com/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#FF2E8E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#FDF3E3;--paper:#FFFDF6;--red:#A62B2B;--red-deep:#8E2430;--orange:#E8622C;--amber:#F2B84B;--butter:#F6D67B;--butter-soft:#FBEED2;--ink:#2B1B12;--text:#2B1B12;--text-mid:#5D4A3A;--text-light:#6E5B4A;--border:#E8DBC2}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;padding:24px}
    .card{max-width:520px;text-align:center}
    .tick{width:72px;height:72px;border-radius:999px 999px 20px 20px;background:var(--amber);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;transform:rotate(-2deg)}
    .tick svg{width:32px;height:32px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.7rem,4vw,2.2rem);font-weight:700;letter-spacing:-0.03em;margin-bottom:12px}
    p{color:var(--text-mid);margin-bottom:28px;font-size:1.02rem}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;padding:14px 28px;border-radius:999px;text-decoration:none;transition:all .25s}
    .btn-primary{background:var(--red-deep);color:var(--cream)}.btn-primary:hover{background:var(--red);transform:translateY(-1px)}
    .btn-ghost{color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--butter-soft)}
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="12a34e02-1c0b-4785-a7d3-93fec86c04f1"></script>
</head>
<body>
  <div class="card">
    <div class="tick"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>Thanks, that's come through</h1>
    <p>Your message is on its way to my inbox. I read everything myself and I'll get back to you within a day.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="https://linkedin.com/in/jesstresidder/" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">Connect on LinkedIn</a>
    </div>
  </div>
</body>
</html>
